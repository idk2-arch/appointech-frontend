name: CI

on:
  push:
    branches: [desarrollo]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-sonar:
    name: Build, pruebas y análisis de Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo para atribuir el código nuevo.
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la configuración de Geoapify
        # El archivo real está en .gitignore. Con el secreto GEOAPIFY_API_KEY (opcional) se usa esa llave;
        # sin él, un valor de relleno, suficiente para compilar y probar. GitHub oculta el secreto en los logs.
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          printf "export const GEOAPIFY_API_KEY = '%s';\n" "${GEOAPIFY_API_KEY:-ci-placeholder}" > src/app/core/config/geoapify.config.ts

      - name: Build
        run: npm run build

      - name: Pruebas con cobertura
        run: npm run test:ci

      - name: Análisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
