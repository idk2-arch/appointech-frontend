# Tipo MIME del manifiesto de la PWA (la tabla por defecto de nginx no lo conoce).
types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Google Sign-In abre una ventana emergente y le habla por postMessage: con same-origin la bloquearía.
    # (add_header dentro de un location reemplaza los del server: si se agregan cabeceras ahí, repetir esta.)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Piezas del service worker y punto de entrada: siempre se revalidan para que las actualizaciones lleguen.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Archivos con hash en el nombre (JS y CSS compilados): su contenido nunca cambia, se cachean un año.
    location ~* "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
