# Tipo MIME del manifiesto de la PWA (la tabla por defecto de nginx no lo conoce).
types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Google Sign-In abre una ventana emergente y le habla por postMessage: con same-origin la bloquearía.
    # (add_header dentro de un location reemplaza los del server: si se agregan cabeceras ahí, repetir esta.)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # API: con docker compose el navegador llama a /api en este mismo origen y nginx la pasa al backend.
    # (En Kubernetes el Ingress reparte /api al backend antes de llegar aquí.) La dirección va en una variable
    # para que nginx arranque aunque el nombre "backend" no exista en la red donde corre la imagen.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $servidor_backend http://backend:8080;
        # Fotos de perfil y de cita viajan en base64 dentro del JSON (~33 % más que la imagen, máximo 1 MB).
        client_max_body_size 2m;
        proxy_pass $servidor_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Piezas del service worker y punto de entrada: siempre se revalidan para que las actualizaciones lleguen.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Archivos con hash en el nombre (JS y CSS compilados): su contenido nunca cambia, se cachean un año.
    location ~* "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
