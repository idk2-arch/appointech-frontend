# Análisis de SonarQube Cloud (https://sonarcloud.io).
# El token NO va aquí: se entrega por el secreto SONAR_TOKEN de GitHub Actions.

# Identificación del proyecto. Deben coincidir con lo que muestre SonarQube Cloud al importar el repositorio.
sonar.organization=idk2-arch
sonar.projectKey=idk2-arch_appointech-frontend
sonar.projectName=appointech-frontend
sonar.host.url=https://sonarcloud.io

# Código fuente y pruebas (las pruebas viven junto al código, en *.spec.ts).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Lo que no es código propio: dependencias, salida de compilación, archivos generados, specs y mocks.
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.mock.ts,**/mocks/**,**/__mocks__/**,**/dist/**,**/coverage/**,**/.angular/**,src/main.ts,src/index.html

# Cobertura: el reporte lo genera "npm run test:ci" (Vitest con cobertura v8).
# Angular lo escribe en una carpeta con el nombre del proyecto.
sonar.javascript.lcov.reportPaths=coverage/appointech-frontend/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts,**/*.module.ts,**/*-routing.module.ts

# TypeScript
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.spec.json
