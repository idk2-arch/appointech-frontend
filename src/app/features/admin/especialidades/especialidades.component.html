<div class="mx-auto max-w-6xl px-6 py-8 sm:px-10">
  <h1 class="text-lg font-semibold tracking-tight text-white">Especialidades de técnicos</h1>

  <app-rubber-segment
    class="mt-6 inline-block"
    [items]="tabs"
    [(value)]="tabActiva"
    ariaLabel="Secciones de especialidades"
  ></app-rubber-segment>

  <div class="mt-6">
    @if (tabActiva === 'catalogo') {
      <app-catalogo-especialidades></app-catalogo-especialidades>
    } @else {
      <app-asignar-tecnicos></app-asignar-tecnicos>
    }
  </div>
</div>
