@if (abierto) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto px-4 py-8"
    role="dialog"
    aria-modal="true"
    aria-labelledby="nueva-especialidad-titulo"
  >
    <div class="fixed inset-0 bg-black/60" (click)="onCancelar()"></div>

    <div class="relative z-10 w-full max-w-md rounded-2xl border border-white/10 bg-[#111a30] p-6 shadow-2xl">
      <div class="flex items-start justify-between gap-4">
        <h2 id="nueva-especialidad-titulo" class="text-lg font-semibold text-white">Nueva especialidad</h2>
        <button
          type="button"
          (click)="onCancelar()"
          aria-label="Cerrar"
          class="rounded-lg p-1 text-white/40 transition hover:bg-white/5 hover:text-white"
        >
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">
        <div class="relative">
          <input
            id="especialidad-nombre"
            type="text"
            formControlName="nombre"
            placeholder=" "
            [attr.aria-invalid]="nombre?.invalid && nombre?.touched ? true : null"
            [attr.aria-describedby]="nombre?.invalid && nombre?.touched ? 'especialidad-nombre-error' : null"
            class="peer w-full rounded-xl border border-white/15 bg-white/5 px-4 pt-5 pb-2 text-sm text-white
                   placeholder-transparent outline-none transition focus:border-[#D98E4A]/60 focus:bg-white/[0.08]"
          />
          <label
            for="especialidad-nombre"
            class="pointer-events-none absolute left-4 top-2 text-xs text-white/50 transition-all
                   peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-placeholder-shown:text-white/40
                   peer-focus:top-2 peer-focus:text-xs peer-focus:text-white/60"
          >
            Nombre
          </label>
          @if (nombre?.invalid && nombre?.touched) {
            <p id="especialidad-nombre-error" role="alert" class="mt-1.5 text-xs text-rose-300">
              Ingresa el nombre de la especialidad.
            </p>
          }
        </div>

        <div class="relative">
          <textarea
            id="especialidad-descripcion"
            formControlName="descripcion"
            placeholder=" "
            rows="3"
            class="peer w-full resize-none rounded-xl border border-white/15 bg-white/5 px-4 pt-5 pb-2 text-sm text-white
                   placeholder-transparent outline-none transition focus:border-[#D98E4A]/60 focus:bg-white/[0.08]"
          ></textarea>
          <label
            for="especialidad-descripcion"
            class="pointer-events-none absolute left-4 top-2 text-xs text-white/50 transition-all
                   peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-placeholder-shown:text-white/40
                   peer-focus:top-2 peer-focus:text-xs peer-focus:text-white/60"
          >
            Descripción (opcional)
          </label>
        </div>

        @if (errorMensaje) {
          <div role="alert" class="rounded-lg border border-rose-400/30 bg-rose-400/10 px-3 py-2 text-sm text-rose-200">
            {{ errorMensaje }}
          </div>
        }

        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="onCancelar()"
            [disabled]="cargando"
            class="rounded-xl px-4 py-2.5 text-sm font-medium text-white/60 transition hover:text-white disabled:cursor-not-allowed disabled:opacity-60"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="cargando"
            class="flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-2.5 text-sm font-medium
                   text-slate-900 transition hover:bg-white/90 disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (cargando) {
              <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4z"></path>
              </svg>
              Creando…
            } @else {
              Crear especialidad
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
