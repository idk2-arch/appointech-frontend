<div class="mt-3" [attr.aria-busy]="cargando">
  <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <button
      type="button"
      (click)="redactar()"
      [disabled]="!puedeRedactar"
      class="inline-flex items-center gap-2 rounded-full border border-[#D98E4A]/40 bg-[#D98E4A]/10 px-4 py-2 text-sm font-medium text-[#D98E4A] transition hover:border-[#D98E4A]/70 disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (cargando) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="3"
          ></circle>
          <path
            class="opacity-90"
            fill="currentColor"
            d="M4 12a8 8 0 0 1 8-8v3a5 5 0 0 0-5 5H4z"
          ></path>
        </svg>
      }
      Redactar de forma técnica
    </button>

    @if (puedeDeshacer) {
      <button
        type="button"
        (click)="deshacer()"
        class="rounded-full px-3 py-2 text-sm font-medium text-white/70 underline-offset-4 transition hover:text-white hover:underline"
      >
        Deshacer
      </button>
    }
  </div>

  <div aria-live="polite">
    @if (cargando) {
      <p class="mt-2 text-sm text-white/60">Redactando…</p>
    }
    @if (puedeDeshacer) {
      <p class="mt-2 text-xs text-white/60">Redactado con IA; revísalo antes de continuar</p>
    }
    @if (aviso) {
      <p class="mt-2 text-sm text-white/60">{{ aviso }}</p>
    }
  </div>
</div>
