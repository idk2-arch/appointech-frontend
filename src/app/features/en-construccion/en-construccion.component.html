<div class="relative min-h-screen w-full overflow-hidden bg-[#0B1224]">
  <!-- Fondo animado -->
  <div class="absolute inset-0 z-0">
    <app-gradient-waves></app-gradient-waves>
  </div>

  <!-- Contenido -->
  <div class="relative z-10 flex min-h-screen items-center justify-center px-6 py-12">
    <div appAparecer="simple" stagger="0.06" duration="0.5" class="w-full max-w-md text-center">

      <!-- Marca -->
      <div class="mb-10 flex items-center justify-center gap-3">
        <app-logo clase="h-12"></app-logo>
        <span class="text-lg font-semibold tracking-tight text-white">AppoinTech</span>
      </div>

      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-white/15 bg-white/5 text-3xl">
        🚧
      </div>

      <h1 class="text-3xl font-semibold tracking-tight text-white">En construcción</h1>
      <p class="mt-2 text-sm text-white/60">
        Estamos trabajando en esta sección, vuelve pronto.
      </p>

      <button
        type="button"
        (click)="cerrarSesion()"
        class="mt-10 w-full rounded-xl border border-white/15 bg-white/5 py-3 text-sm font-medium text-white
               transition hover:bg-white/10"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
