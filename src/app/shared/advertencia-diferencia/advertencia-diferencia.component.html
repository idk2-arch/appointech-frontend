<section
  role="alert"
  aria-labelledby="advertencia-diferencia-titulo"
  class="rounded-xl border border-amber-300/40 bg-amber-300/10 p-4"
>
  <h3 id="advertencia-diferencia-titulo" class="flex items-center gap-2 fs-cuerpo font-semibold text-amber-200">
    <span aria-hidden="true">⚠</span>
    Atención: el costo final es distinto al estimado
  </h3>
  <dl class="mt-3 grid gap-3 fs-cuerpo sm:grid-cols-3">
    <div>
      <dt class="fs-secundario text-white/60">Costo estimado</dt>
      <dd class="font-medium text-white">{{ pago.montoCotizado | pesos }}</dd>
    </div>
    <div>
      <dt class="fs-secundario text-white/60">Costo final</dt>
      <dd class="font-medium text-white">{{ pago.montoFinal | pesos }}</dd>
    </div>
    <div>
      <dt class="fs-secundario text-white/60">Diferencia</dt>
      <dd class="font-medium text-amber-200">{{ porcentaje }}</dd>
    </div>
  </dl>
  <p class="mt-3 fs-secundario text-white/70">Revisa estos valores antes de elegir cómo pagar.</p>
</section>
