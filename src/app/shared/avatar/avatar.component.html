@if (src && !fallo) {
  <img
    [src]="src"
    [alt]="alt"
    (error)="alFallar()"
    loading="lazy"
    class="block h-full w-full rounded-full border border-white/15 bg-white/5 object-cover"
  />
} @else {
  <span
    role="img"
    [attr.aria-label]="alt"
    class="flex h-full w-full select-none items-center justify-center rounded-full border border-acento/40 bg-acento/10 font-medium text-acento"
    [class]="claseTexto"
  >
    {{ iniciales }}
  </span>
}
