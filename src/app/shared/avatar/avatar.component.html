@if (src && !fallo) {
  <img
    [src]="src"
    [alt]="alt"
    (error)="alFallar()"
    loading="lazy"
    class="inline-block shrink-0 rounded-full border border-white/15 bg-white/5 object-cover"
    [class]="clasesTamano"
  />
} @else {
  <span
    role="img"
    [attr.aria-label]="alt"
    class="inline-flex shrink-0 select-none items-center justify-center rounded-full border border-acento/40 bg-acento/10 font-medium text-acento"
    [class]="clasesTamano"
  >
    {{ iniciales }}
  </span>
}
