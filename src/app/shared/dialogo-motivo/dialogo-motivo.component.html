<app-modal-formulario
  [titulo]="titulo"
  [subtitulo]="subtitulo"
  [textoEnviar]="textoEnviar"
  [textoCargando]="textoCargando"
  [cargando]="cargando"
  [errorMensaje]="errorMensaje"
  (cerrar)="cerrar.emit()"
  (enviar)="enviar()"
>
  <div>
    <label for="dialogo-motivo-texto" class="block fs-cuerpo font-medium text-white">
      {{ etiqueta }}{{ obligatorio ? '' : ' (opcional)' }}
    </label>
    <textarea
      id="dialogo-motivo-texto"
      [formControl]="motivo"
      rows="4"
      [attr.aria-invalid]="motivo.invalid && motivo.touched ? true : null"
      [attr.aria-describedby]="'dialogo-motivo-ayuda'"
      class="mt-2 w-full resize-none rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 fs-cuerpo text-white outline-none transition
             focus:border-[#D98E4A] focus:bg-white/[0.08]"
    ></textarea>
    <div id="dialogo-motivo-ayuda" class="mt-1.5 flex items-start justify-between gap-3 fs-secundario">
      @if (motivo.invalid && motivo.touched) {
        <p role="alert" class="text-rose-300">
          @if (motivo.hasError('required')) {
            Escribe el motivo.
          } @else {
            El motivo no puede superar {{ max }} caracteres.
          }
        </p>
      } @else {
        <span></span>
      }
      <span class="shrink-0" [class]="motivo.value.length > max ? 'text-rose-300' : 'text-white/60'">
        {{ motivo.value.length }}/{{ max }}
      </span>
    </div>
  </div>
</app-modal-formulario>
