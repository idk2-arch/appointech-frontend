<div class="fixed inset-0 z-50 flex items-center justify-center px-4 py-8" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <div class="fixed inset-0 bg-black/80" data-fondo (click)="cerrar.emit()"></div>
  <div class="relative z-10 max-h-full max-w-3xl">
    <img [src]="src" [alt]="alt" class="max-h-[80vh] w-auto rounded-2xl border border-white/10 object-contain shadow-2xl" />
    <button
      #botonCerrar
      type="button"
      (click)="cerrar.emit()"
      aria-label="Cerrar foto"
      class="absolute right-2 top-2 rounded-full border border-white/20 bg-fondo/80 p-2 text-white/80 transition hover:text-white
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-acento"
    >
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</div>
