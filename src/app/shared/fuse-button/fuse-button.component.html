<span
  #rootEl
  tabindex="-1"
  class="fuse-button"
  [attr.data-phase]="phase"
  [attr.data-fuse]="fuse"
  [attr.data-instant]="instant ? '' : null"
  [attr.aria-disabled]="phase === 'settled' ? true : null"
  [style.--fb-ink]="color"
  [style.--fb-bg]="background"
  [style.--fb-fuse]="fuseColor"
  [style.--fb-fuse-h.px]="fuseThickness"
  [style.--fb-radius.px]="radius"
  [style.--fb-fade.ms]="crossfadeMs"
  [style.--fb-h.px]="preset.height"
  [style.--fb-fs.px]="preset.font"
  [style.--fb-icon.px]="preset.icon"
  [style.--fb-px.px]="preset.px"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerCancel()"
  (pointerenter)="onPointerEnter($event)"
  (pointerleave)="onPointerLeave($event)"
  (keydown)="onKeyDown($event)"
>
  <button
    #idleBtn
    type="button"
    class="fuse-button__face fuse-button__idle"
    [disabled]="disabled"
    [inert]="phase !== 'idle'"
    (click)="arm()"
  >
    <span class="fuse-button__icon" aria-hidden="true">
      @switch (icon) {
        @case ('archive') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 8h16M4 8v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8M4 8L5.5 4h13L20 8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 12.5h4" stroke-linecap="round" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9" />
            <path d="M6.5 6.5l11 11" stroke-linecap="round" />
          </svg>
        }
      }
    </span>
    {{ label }}
  </button>

  <button
    #undoBtn
    type="button"
    class="fuse-button__face fuse-button__undo"
    [attr.aria-describedby]="statusId"
    aria-keyshortcuts="Escape"
    [inert]="phase !== 'armed'"
    (click)="onUndoClick()"
  >
    <span class="fuse-button__icon fuse-button__icon--undo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M7 7h8a5 5 0 0 1 0 10h-4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10 4L6.5 7 10 10" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    {{ undoLabel }}
    @if (fuse !== 'outline') {
      <i #lineEl class="fuse-button__fuse" aria-hidden="true"></i>
    }
  </button>

  <span class="fuse-button__face fuse-button__settled" [inert]="phase !== 'settled'">
    <span class="fuse-button__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    {{ doneLabel }}
  </span>

  @if (fuse === 'outline') {
    <svg class="fuse-button__rim" aria-hidden="true">
      <rect #rimEl pathLength="1" />
    </svg>
  }

  <span class="fuse-button__status" [id]="statusId" role="status" aria-live="polite">
    {{ phase === 'idle' ? '' : doneLabel }}
  </span>
</span>
