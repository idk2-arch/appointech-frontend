<fieldset>
  <legend class="block text-base font-medium text-white">Especialidades (opcional)</legend>
  <p class="mt-1 text-sm text-white/60">Marca los electrodomésticos que este técnico sabe reparar.</p>

  @if (cargando) {
    <p class="mt-3 text-base text-white/70" role="status">Cargando especialidades…</p>
  } @else if (error) {
    <div role="alert" class="mt-3 rounded-lg border border-rose-400/30 bg-rose-400/10 px-4 py-3 text-base text-rose-200">
      {{ error }}
      <button type="button" (click)="reintentar.emit()" class="ml-2 font-medium underline">Intentar de nuevo</button>
    </div>
  } @else if (!catalogo.length) {
    <p class="mt-3 text-base text-white/70">Todavía no hay especialidades creadas.</p>
  } @else {
    <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
      @for (e of catalogo; track e.id) {
        <label
          [for]="id + '-' + e.id"
          class="flex min-h-14 cursor-pointer items-center gap-3 rounded-xl border px-4 py-3 text-base text-white transition"
          [class]="estaElegida(e.id) ? 'border-[#D98E4A] bg-[#D98E4A]/10' : 'border-white/20 bg-white/5 hover:border-white/40'"
        >
          <input
            type="checkbox"
            [id]="id + '-' + e.id"
            [checked]="estaElegida(e.id)"
            (change)="alternar(e.id)"
            class="h-6 w-6 shrink-0 accent-[#D98E4A]"
          />
          <span>{{ e.nombre }}</span>
        </label>
      }
    </div>
  }
</fieldset>
