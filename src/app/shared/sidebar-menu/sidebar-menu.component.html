<div #list class="sidebar-menu__list" (mouseleave)="onRowLeave()">
  <div class="sidebar-menu__pill" [class.is-visible]="pillVisible" [style.transform]="'translateY(' + pillTop + 'px)'" [style.height.px]="pillHeight" aria-hidden="true"></div>

  @for (item of items; track item.value; let i = $index) {
    @if (item.disabled) {
      <button
        #rowEl
        type="button"
        disabled
        [title]="item.disabledTitle ?? 'Disponible próximamente'"
        class="sidebar-menu__row"
      >
        <span class="sidebar-menu__icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('chart') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M4 20V13M10 20V9M16 20v-5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M3 20h18" stroke-linecap="round" />
              </svg>
            }
            @case ('users') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="9" cy="8" r="3" />
                <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round" />
                <circle cx="17.5" cy="9" r="2.2" />
                <path d="M15.8 14.2a5 5 0 0 1 5.2 5" stroke-linecap="round" />
              </svg>
            }
            @case ('tool') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path
                  d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
            @case ('alert') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M12 4L3 20h18L12 4z" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 10v4" stroke-linecap="round" />
                <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none" />
              </svg>
            }
            @case ('settings') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
                  stroke-linecap="round"
                />
              </svg>
            }
            @case ('receipt') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9 8h6M9 12h6" stroke-linecap="round" />
              </svg>
            }
          }
        </span>
        <span class="sidebar-menu__text">
          <span class="sidebar-menu__label">{{ item.label }}</span>
          <span class="sidebar-menu__soon">Próximamente</span>
        </span>
      </button>
    } @else {
      <a
        #rowEl
        [routerLink]="item.routerLink"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: false }"
        (isActiveChange)="onActiveChange(i, $event)"
        (mouseenter)="onRowEnter(i)"
        class="sidebar-menu__row"
        [class.is-active]="i === activeIndex"
      >
        <span class="sidebar-menu__icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('chart') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M4 20V13M10 20V9M16 20v-5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M3 20h18" stroke-linecap="round" />
              </svg>
            }
            @case ('users') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="9" cy="8" r="3" />
                <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round" />
                <circle cx="17.5" cy="9" r="2.2" />
                <path d="M15.8 14.2a5 5 0 0 1 5.2 5" stroke-linecap="round" />
              </svg>
            }
            @case ('tool') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path
                  d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
            @case ('alert') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M12 4L3 20h18L12 4z" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 10v4" stroke-linecap="round" />
                <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none" />
              </svg>
            }
            @case ('settings') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
                  stroke-linecap="round"
                />
              </svg>
            }
            @case ('receipt') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9 8h6M9 12h6" stroke-linecap="round" />
              </svg>
            }
          }
        </span>
        <span class="sidebar-menu__text">
          <span class="sidebar-menu__label">{{ item.label }}</span>
        </span>
      </a>
    }
  }
</div>
