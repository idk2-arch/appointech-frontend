<div
  class="swipe-toast"
  [attr.data-phase]="fase()"
  [attr.data-inline]="inline"
  [attr.data-fuse]="duration > 0 ? fuse : 'none'"
  [attr.data-dismissible]="dismissible"
  [attr.data-instant]="instantaneo() ? '' : null"
  [attr.data-mounted]="montado()"
  [attr.data-tipo]="tipo"
  [style.--st-bg]="background"
  [style.--st-ink]="color"
  [style.--st-fuse]="fuseColor"
  [style.--st-w.px]="width"
  [style.--st-radius.px]="radius"
  [style.--st-slide.ms]="slideMs"
>
  <div class="swipe-toast__gate">
    <div class="swipe-toast__lift">
      <div
        #tarjeta
        class="swipe-toast__card"
        [attr.role]="rol"
        [attr.aria-live]="rol === 'alert' ? 'assertive' : 'polite'"
        aria-atomic="true"
      >
        @if (tipo) {
          <span class="swipe-toast__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @switch (tipo) {
                @case ('exito') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M8 12.5l2.7 2.7L16 9.8" />
                }
                @case ('advertencia') {
                  <path d="M12 3.5l9.5 16.5h-19z" />
                  <path d="M12 10v4.5M12 17.4v.1" />
                }
                @case ('error') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M9 9l6 6M15 9l-6 6" />
                }
                @default {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 11v5M12 7.9v.1" />
                }
              }
            </svg>
          </span>
        }
        <span class="swipe-toast__body">
          <span class="swipe-toast__title">{{ title }}</span>
          @if (description) {
            <span class="swipe-toast__desc">{{ description }}</span>
          }
        </span>
        @if (tieneAccion) {
          <button type="button" class="swipe-toast__action" (click)="alAccion()">{{ actionLabel }}</button>
        }
        @if (closeButton) {
          <button type="button" class="swipe-toast__close" aria-label="Cerrar aviso" (click)="cerrar('close')">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        }
        <i #mecha class="swipe-toast__fuse" aria-hidden="true"></i>
      </div>
    </div>
  </div>
</div>
